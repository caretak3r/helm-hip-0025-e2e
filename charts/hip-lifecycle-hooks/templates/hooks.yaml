---
apiVersion: batch/v1
kind: Job
metadata:
  name: hook-weight-minus-5
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hook
          image: busybox:1.36
          command: ["sh", "-c", "exit 0"]
