# kind cluster with kube-apiserver audit logging. scripts/cluster-up.sh replaces
# @ROOT@ with the absolute path of this repository (kind does not expand
# variables) and writes the result to .work/kind-cluster.yaml.
#
# The tests read every ordering fact and every readiness fact from the audit
# log, because only the apiserver sees all requests on one clock:
#   host  kind/audit-policy.yaml -> node /etc/kubernetes/policies/ -> apiserver --audit-policy-file
#   host  .audit/                <- node /var/log/kubernetes/audit/ <- apiserver --audit-log-path
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
            audit-log-path: /var/log/kubernetes/audit/audit.log
            audit-log-maxsize: "500"
            audit-log-maxbackup: "1"
          extraVolumes:
            - name: audit-policy
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes/audit
              mountPath: /var/log/kubernetes/audit
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: "@ROOT@/kind/audit-policy.yaml"
        containerPath: /etc/kubernetes/policies/audit-policy.yaml
        readOnly: true
      - hostPath: "@ROOT@/.audit"
        containerPath: /var/log/kubernetes/audit
        readOnly: false
