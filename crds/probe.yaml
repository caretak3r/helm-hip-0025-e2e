# Probe: a do-nothing custom resource whose .status the tests write directly
# (kubectl patch --subresource=status), so custom readiness is driven at exact,
# audit-logged moments. Status is free-form so R34 can compare strings, numbers
# and booleans.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: probes.readiness.hip0025.example
spec:
  group: readiness.hip0025.example
  names: {kind: Probe, listKind: ProbeList, plural: probes, singular: probe}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
